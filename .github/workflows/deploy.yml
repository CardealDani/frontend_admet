name: Deploy to GitHub Pages

on:
  push:
    branches: ["develop"] # Ou "master", dependendo do nome da sua branch

# Permissões necessárias para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─── ETAPA 1: BUILD (Gerar os ficheiros) ───
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci # ou npm install

      - name: Fazer o Build (Vite)
        run: npm run build

      # 🔴 O SEGREDO ESTÁ AQUI: Esta é a action que estava a faltar!
      - name: Upload do Artifact para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Pasta padrão onde o Vite coloca os ficheiros prontos

  # ─── ETAPA 2: DEPLOY (Publicar no ar) ───
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build # Garante que o deploy só roda depois do build terminar
    runs-on: ubuntu-latest
    steps:
      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # ou v5, que é a versão que você estava a usar